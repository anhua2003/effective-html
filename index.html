<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Effective HTML — Demos</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 20px;
      background: #f5f5f5;
    }

    h1 {
      margin-bottom: 10px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    a {
      display: block;
      padding: 25px;
      background: white;
      border-radius: 12px;
      color: inherit;
      text-decoration: none;
      box-shadow: 0 2px 10px #0001;
    }

    a:hover {
      transform: translateY(-3px);
    }
  </style>
</head>

<body>

  <h1>Effective HTML</h1>

  <p>
    HTML wireframes, mockups and interactive prototypes.
  </p>

  <div class="grid">

    <a href="./examples/release-readiness/wireframe.html">
      <h2>Wireframe</h2>
      <p>View the wireframe demo.</p>
    </a>

    <a href="./examples/release-readiness/mockup.html">
      <h2>Mockup</h2>
      <p>View the mockup demo.</p>
    </a>

    <a href="./examples/release-readiness/prototype.html">
      <h2>Prototype</h2>
      <p>View the interactive prototype.</p>
    </a>

  </div>

</body>
</html>
